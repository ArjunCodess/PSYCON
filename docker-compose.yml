name: psycon-week4

x-backend-environment: &backend-environment
  PSYCON_ENV: development
  PSYCON_DATABASE_URL: postgresql://psycon:psycon@postgres:5432/psycon
  PSYCON_S3_ENDPOINT_URL: http://minio:9000
  PSYCON_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  PSYCON_S3_ACCESS_KEY: psycon
  PSYCON_S3_SECRET_KEY: psycon-local-object-secret
  PSYCON_S3_BUCKET: psycon-research
  PSYCON_S3_REGION: us-east-1
  PSYCON_SECRET_KEY: psycon-local-flask-secret
  PSYCON_BOOTSTRAP_OPERATOR_TOKEN: psycon-local-operator
  PSYCON_PROFILE_KEY: ${PSYCON_PROFILE_KEY:-}
  PSYCON_COMMUNICATION_SPOOL: /private-spool

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: psycon
      POSTGRES_USER: psycon
      POSTGRES_PASSWORD: psycon
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - psycon_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psycon -d psycon"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: psycon-minio-local:RELEASE.2025-09-07T16-13-09Z
    platform: linux/amd64
    build: ./deploy/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: psycon
      MINIO_ROOT_PASSWORD: psycon-local-object-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - psycon_objects:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/minio/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  api:
    profiles: [legacy]
    build:
      context: .
      target: base
    environment: *backend-environment
    volumes:
      - psycon_private_spool:/private-spool
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 10

  worker:
    profiles: [legacy]
    build:
      context: .
      target: nvidia
    command: ["python", "-m", "backend.worker"]
    environment:
      <<: *backend-environment
      HF_TOKEN: ${HF_TOKEN:-}
      PSYCON_COMMUNITY1_REVISION: ${PSYCON_COMMUNITY1_REVISION:-3533c8cf8e369892e6b79ff1bf80f7b0286a54ee}
      PSYCON_DIARIZATION_DEVICE: cuda
      PSYCON_SPEAKER_DEVICE: cuda
      PSYCON_WHISPER_DEVICE: cuda
      PSYCON_OLLAMA_URL: http://ollama:11434
      PSYCON_OLLAMA_MODEL: qwen3.5:4b
      PSYCON_OLLAMA_DIGEST: ${PSYCON_OLLAMA_DIGEST:-}
    gpus: all
    volumes:
      - .:/app
      - psycon_models:/opt/psycon/hf-cache
      - psycon_private_spool:/private-spool
    depends_on:
      api:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    profiles: [coaching]
    gpus: all
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_KEEP_ALIVE: 0
      OLLAMA_NO_CLOUD: 1
    volumes:
      - psycon_ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  psycon_postgres:
  psycon_objects:
  psycon_models:
  psycon_private_spool:
  psycon_ollama:
