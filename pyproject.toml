[project]
name = "psycon"
version = "0.2.0"
description = "Audio-first longitudinal communication evidence, personal baselines, and reference-profile research."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires a running PostgreSQL, MinIO, API, and worker stack",
]

